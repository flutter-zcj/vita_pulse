version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: vitapulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: vitapulse
      POSTGRES_PASSWORD: vitapulse
      POSTGRES_DB: vitapulse
      TZ: Asia/Shanghai
    ports:
      - '15432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/ruoyi-fastapi-pg.sql:/docker-entrypoint-initdb.d/01-ruoyi.sql:ro
      - ./sql/vital-init.sql:/docker-entrypoint-initdb.d/02-vital.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U vitapulse']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: vitapulse-redis
    restart: unless-stopped
    ports:
      - '16379:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.pg
    container_name: vitapulse-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    ports:
      - '9099:9099'

volumes:
  pgdata:
